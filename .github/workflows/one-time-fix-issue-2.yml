name: One-time fix Issue 2

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  fix-feedback-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fix feedback navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = """function openFeedback(type,q){
            const url=buildFeedbackUrl(type,q);
            const w=window.open(url,'_blank','noopener,noreferrer');
            if(!w) window.location.href=url;
          }"""
          new = """function openFeedback(type,q){
            const url=buildFeedbackUrl(type,q);
            window.open(url,'_blank','noopener,noreferrer');
          }"""
          if old not in text:
              raise SystemExit('Expected openFeedback implementation not found; no changes made.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-fix-issue-2.yml

      - name: Commit fix to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-fix-issue-2.yml
          git commit -m "Fix #2 keep trainer tab open for feedback"
          git push origin HEAD:dev
